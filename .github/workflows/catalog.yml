# Rebuilds data/catalog.json from CelesTrak every 2 hours (CelesTrak's own update cadence) and redeploys the site.
# The catalogue is generated during the build only, so the repository history doesn't grow with every update.
name: catalog
on:
  schedule:
    - cron: '7 */2 * * *'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore CelesTrak response cache
        uses: actions/cache@v4
        with:
          path: tools/cache
          key: celestrak-${{ github.run_id }}
          restore-keys: celestrak-
      - name: Build catalogue
        run: node tools/buildcatalog.cjs
      - name: Assemble site
        run: mkdir _site && cp -r index.html css js vendor data icons manifest.webmanifest sw.js .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
